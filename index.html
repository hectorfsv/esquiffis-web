<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0708">
<title>Esquiffis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* Esquiffis, the web door. One assistant, three ways in: Telegram on the phone,
   this page, and the desktop pet. This page talks to the SAME agent (memory,
   tools, guard) through the access point on the Esquiffis workflow.

   Design notes (2026-09-14 redesign): the conversation is the product, so
   nothing competes with the words. Two faces only - Bebas Neue for the name,
   Barlow for everything read. One red, one rule. The wordmark on the lock
   screen is the single loud element; the sweep under the header is the only
   motion, and it answers a send. Nothing is position:fixed, so iOS Safari's
   moving address bar and keyboard have nothing to break. */
:root{
  --void:#0A0708;
  --panel:#171214;
  --rule:rgba(255,120,110,.14);
  --ink:#F2EAE8;
  --smoke:#928789;
  --red:#E01B1B;
  --red-deep:#9E1212;
  --disp:'Bebas Neue','Arial Narrow',Impact,sans-serif;
  --text:'Barlow','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--ink);font-family:var(--text);
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* the app is one column the height of the visible viewport; the keyboard
   handler below sets an explicit height when iOS shrinks the visual viewport */
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;min-height:0}
.screen.on{display:flex}

/* ---------- lock ---------- */
.lock{align-items:center;justify-content:center;padding:24px}
.lock-form{width:min(100%,480px);display:flex;flex-direction:column;align-items:flex-start;gap:26px}
/* The name is the one loud thing. Its size is fitted to the form in JS after the
   font lands (fitMark), because a vw clamp cannot know the glyph widths of the
   face that actually loaded - at 168px it ran 516px wide in a 420px form. */
.mark{font-family:var(--disp);font-weight:400;font-size:clamp(72px,22vw,150px);line-height:.86;
  letter-spacing:.01em;color:var(--ink);text-transform:uppercase;white-space:nowrap;
  padding-bottom:.08em;border-bottom:6px solid var(--red);width:100%}
.slot{display:flex;width:100%;border:1px solid var(--rule);background:var(--panel)}
.slot input{flex:1;min-width:0;padding:14px 16px;font-size:17px;letter-spacing:.04em}
.slot input::placeholder{color:var(--smoke)}
.slot button{padding:0 22px;background:var(--red);color:#fff;font-weight:600;font-size:16px;letter-spacing:.01em}
.slot button:disabled{background:var(--red-deep);color:rgba(255,255,255,.7);cursor:default}
.msg{min-height:1.4em;color:var(--smoke);font-size:15px}
.msg.err{color:#FF6B6B}

/* ---------- chat ---------- */
.chat{flex-direction:column}
.top{position:relative;flex:none;display:flex;align-items:center;gap:14px;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--rule)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.face{width:30px;height:30px;object-fit:cover;flex:none;display:block}
.name{font-family:var(--disp);font-size:26px;line-height:1;letter-spacing:.03em;text-transform:uppercase;padding-top:2px}
.status{flex:1;min-width:0;color:var(--smoke);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.status.busy{color:var(--ink)}
.status.bad{color:#FF6B6B}
.ghost{color:var(--smoke);font-size:15px;padding:6px 2px;border-bottom:1px solid transparent;white-space:nowrap}
.ghost:hover{color:var(--ink);border-bottom-color:var(--ink)}
/* the one motion: a red sweep under the header while Esquiffis is thinking */
.sweep{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red);
  transform-origin:left;transform:scaleX(0);animation:sweep 1.6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweep{0%{transform:scaleX(0);transform-origin:left}55%{transform:scaleX(1);transform-origin:left}
  56%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none;transform:none}}

.log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:18px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.col{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.empty{color:var(--smoke);padding:12px 0 0;max-width:36ch}
.empty .lead{color:var(--ink);font-size:22px;font-weight:500;line-height:1.2;margin-bottom:6px}

.m{display:flex;flex-direction:column;max-width:100%}
.m .body{white-space:pre-wrap;overflow-wrap:anywhere}
.m .when{color:var(--smoke);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
/* Hector: a panel, on the right, no ornament */
.m.me{align-self:flex-end;max-width:min(78%,52ch);align-items:flex-end}
.m.me .body{background:var(--panel);padding:10px 14px;border-radius:2px}
/* Esquiffis: his words on the void, marked by the red rule */
.m.esq{align-self:flex-start;max-width:min(100%,68ch)}
.m.esq .body{border-left:3px solid var(--red);padding:2px 0 2px 14px}
.m.esq .body b,.m.esq .body strong{font-weight:600}
.m.esq .body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--panel);padding:1px 5px}
.m.esq .body pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--panel);
  padding:12px 14px;overflow-x:auto;white-space:pre;margin:6px 0}
.m.esq .body pre code{background:none;padding:0}
.m.esq .body a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.m .tag{color:var(--smoke);font-size:13px;margin-top:4px}
/* a note from the page itself (never from Esquiffis) */
.m.note{align-self:flex-start;max-width:60ch}
.m.note .body{color:var(--smoke);border-left:3px solid var(--rule);padding:2px 0 2px 14px}

.composer{flex:none;display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.composer .in{flex:1;min-width:0;display:flex;background:var(--panel);border:1px solid var(--rule)}
.composer textarea{flex:1;min-width:0;resize:none;padding:11px 14px;font-size:17px;line-height:1.4;max-height:160px}
.composer textarea::placeholder{color:var(--smoke)}
.send{flex:none;width:46px;height:46px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.send:disabled{background:var(--red-deep);cursor:default}
.send svg{width:20px;height:20px;fill:currentColor}

@media (min-width:900px){
  .top{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
  .log{padding:28px 28px 16px}
  .composer{padding-left:28px;padding-right:28px;justify-content:center}
  .composer .in{max-width:704px}
}
</style>
</head>
<body>
<div id="app" class="app">

  <section id="scr-lock" class="screen lock on" aria-labelledby="mark">
    <form id="lock-form" class="lock-form" autocomplete="on">
      <h1 id="mark" class="mark">Esquiffis</h1>
      <label class="sr" for="pw">Passphrase</label>
      <div class="slot">
        <input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" autocapitalize="off" spellcheck="false">
        <button id="unlock" type="submit">Unlock</button>
      </div>
      <p id="lock-msg" class="msg" role="alert"></p>
    </form>
  </section>

  <section id="scr-chat" class="screen chat" aria-label="Conversation">
    <header class="top">
      <div class="who">
        <img class="face" id="face" alt="" width="30" height="30">
        <span class="name">Esquiffis</span>
      </div>
      <div id="status" class="status" aria-live="polite">Ready</div>
      <button id="clear" class="ghost" type="button">Clear screen</button>
      <div id="sweep" class="sweep" hidden aria-hidden="true"></div>
    </header>
    <main id="log" class="log">
      <div class="col" id="col">
        <div id="empty" class="empty">
          <p class="lead">Ask anything.</p>
          <p>Same Esquiffis as on your phone. He remembers both.</p>
        </div>
      </div>
    </main>
    <form id="composer" class="composer">
      <label class="sr" for="box">Message</label>
      <div class="in"><textarea id="box" rows="1" placeholder="Message Esquiffis" enterkeyhint="send" autocapitalize="sentences"></textarea></div>
      <button id="send" class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 8h-5v10H9V11H4z"/></svg>
      </button>
    </form>
  </section>

</div>
<script>
(function(){
  'use strict';
  /* ---------- where Esquiffis answers ----------
     The access point on the Esquiffis workflow. Form data on purpose: a JSON
     body is not a CORS "simple" request and would fire a preflight the webhook
     cannot answer. ?dev=1 talks to the DEV copy. */
  var PROD='https://hectorfsv.app.n8n.cloud/webhook/esquiffis-access';
  var BASE=/[?&]dev=1(&|$)/.test(location.search) ? PROD+'-dev' : PROD;
  var K_PW='esq_pw', K_LOG='esq_log';
  var PW_TTL_MS=2*60*60*1000;   // sessionStorage never expires on iOS by itself: timestamp it
  var LOG_MAX=80;               // what a reload shows; Esquiffis's own memory lives on the server
  var WAIT_MS=120*1000;         // real turns run 6-78 s; the webhook connection is cut near 100 s
  var FACE='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QKORXhpZgAATU0AKgAAAAgAAwEOAAIAAAD4AAAAMgE7AAIAAAAlAAABKodpAAQAAAABAAABUAAAAABTaWduYXR1cmU6IGtXZE80dnBHUHNpZkdEZm9FcExNMGNrbFdpem9GOExEclgxYTFlMHZLdlhia1JtRUl5K2xjZlZqb0x0RFN0SEV2YmlSSHpYN0JpdTJhRy9wRjBSdFpMcjRIYVY5ckxDSmJMbVVxQ3cvQzdka0JUNXdmTklNR005QzJhMW40UUdyK3BidWhDRWV6WDFOSnJCS3ZuT3RLL1R3V1ZUbDVsYVViMjZpS3l5L2psVjdzQTZjbitxM2hvL3kwSmFtUysvaWJvamlhMHRPOFh0Qys0L3VzazNEM1MydVpKMFhONmRybTduMHJPQ09vclU9AGNhZTYyMWY4LTVmN2QtNGFhNC1iZDMwLTI0YzFhMGE5NWI0NgAAAASShgAHAAAA/wAAAYagAQADAAAAAQABAACgAgAEAAAAAQAAACqgAwAEAAAAAQAAAFAAAAAAQVNDSUkAAABTaWduYXR1cmU6IGtXZE80dnBHUHNpZkdEZm9FcExNMGNrbFdpem9GOExEclgxYTFlMHZLdlhia1JtRUl5K2xjZlZqb0x0RFN0SEV2YmlSSHpYN0JpdTJhRy9wRjBSdFpMcjRIYVY5ckxDSmJMbVVxQ3cvQzdka0JUNXdmTklNR005QzJhMW40UUdyK3BidWhDRWV6WDFOSnJCS3ZuT3RLL1R3V1ZUbDVsYVViMjZpS3l5L2psVjdzQTZjbitxM2hvL3kwSmFtUysvaWJvamlhMHRPOFh0Qys0L3VzazNEM1MydVpKMFhONmRybTduMHJPQ09vclU9AP/tADhQaG90b3Nob3AgMy4wADhCSU0EBAAAAAAAADhCSU0EJQAAAAAAENQdjNmPALIE6YAJmOz4Qn7/wAARCABQACoDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9sAQwACAgICAgIDAgIDBQMDAwUGBQUFBQYIBgYGBgYICggICAgICAoKCgoKCgoKDAwMDAwMDg4ODg4PDw8PDw8PDw8P/9sAQwECAgIEBAQHBAQHEAsJCxAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ/90ABAAD/9oADAMBAAIRAxEAPwD+f+iiigAooooAKKUqw5IpKAP/0P5/6KKKACtCxtDcPgVTiTzHCk4HfvXsvwv8Cap418VaV4W0SIz3mq3EcEK9t0jADJ9B1J7CoqTUU2zrwWFlWqxpQ3Zgal4K1TTtFtNau7SSK0vt4glZSEkMeA+0ng7SRnHSuDMKgkYr68/aZ8YaR   function $(id){return document.getElementById(id)}
  var pw='', log=[], busy=false, tick=null, t0=0, aborter=null;

  /* ---------- remembered things ---------- */
  function savePw(v){ try{ sessionStorage.setItem(K_PW, JSON.stringify({v:v,t:Date.now()})) }catch(e){} }
  function loadPw(){
    try{ var s=JSON.parse(sessionStorage.getItem(K_PW)||'null');
      if(s && s.v && s.t && Date.now()-s.t < PW_TTL_MS) return s.v; }catch(e){}
    return '';
  }
  function clearPw(){ try{ sessionStorage.removeItem(K_PW) }catch(e){} }
  function saveLog(){ try{ localStorage.setItem(K_LOG, JSON.stringify(log.slice(-LOG_MAX))) }catch(e){} }
  function loadLog(){
    try{ var a=JSON.parse(localStorage.getItem(K_LOG)||'[]'); if(Array.isArray(a)) log=a.filter(function(m){return m&&m.r&&typeof m.m==='string'}); }catch(e){ log=[] }
  }

  /* ---------- the transport ---------- */
  function post(fields, signal){
    var fd=new FormData();
    Object.keys(fields).forEach(function(k){ fd.append(k, fields[k]) });
    return fetch(BASE,{method:'POST',body:fd,signal:signal});
  }

  /* ---------- lock ---------- */
  function lockMsg(t, bad){ var el=$('lock-msg'); el.textContent=t||''; el.classList.toggle('err', !!bad); }
  function unlock(e){
    if(e) e.preventDefault();
    var v=$('pw').value.trim();
    if(!v){ lockMsg('Enter the passphrase.', true); return }
    $('unlock').disabled=true; lockMsg('');
    post({action:'login', password:v})
      .then(function(r){
        if(r.status===401){ lockMsg('That passphrase is not right.', true); return }
        if(!r.ok){ lockMsg('Esquiffis did not answer ('+r.status+'). Try again.', true); return }
        pw=v; savePw(v); enter();
      })
      .catch(function(){ lockMsg("Can't reach Esquiffis. Check your connection.", true) })
      .finally(function(){ $('unlock').disabled=false });
  }
  function lockOut(why){
    pw=''; clearPw(); setBusy(false);
    show('scr-lock'); $('pw').value=''; lockMsg(why||'', true);
  }
  function show(id){
    ['scr-lock','scr-chat'].forEach(function(s){ $(s).classList.toggle('on', s===id) });
  }
  function enter(){
    show('scr-chat'); loadLog(); render(); setStatus('Ready');
    // a focused field on the phone pops the keyboard over the conversation; only the desktop wants it
    if(window.matchMedia && matchMedia('(pointer:fine)').matches) setTimeout(function(){ $('box').focus() }, 50);
  }

  /* ---------- rendering ---------- */
  var ALLOW={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',S:'s',STRIKE:'s',DEL:'s',CODE:'code',PRE:'pre',A:'a',BR:'br'};
  var URL_RE=/https?:\/\/[^\s<>"')\]]+[^\s<>"')\].,;:!?]/g;
  function textWithLinks(text, into){
    var last=0, m; URL_RE.lastIndex=0;
    while((m=URL_RE.exec(text))){
      if(m.index>last) into.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a=document.createElement('a'); a.href=m[0]; a.textContent=m[0]; a.target='_blank'; a.rel='noopener';
      into.appendChild(a); last=m.index+m[0].length;
    }
    if(last<text.length) into.appendChild(document.createTextNode(text.slice(last)));
  }
  /* Esquiffis writes for Telegram: plain text with line breaks and, at most, the
     tags Telegram allows. Everything else becomes text or a line break. Nothing
     he writes can run here. */
  function sanitize(html){
    var frag=document.createDocumentFragment();
    var doc; try{ doc=new DOMParser().parseFromString('<div>'+String(html)+'</div>','text/html') }catch(e){ doc=null }
    if(!doc){ textWithLinks(String(html), frag); return frag }
    function walk(node, into, inPre){
      for(var c=node.firstChild; c; c=c.nextSibling){
        if(c.nodeType===3){ if(inPre) into.appendChild(document.createTextNode(c.nodeValue)); else textWithLinks(c.nodeValue, into); continue }
        if(c.nodeType!==1) continue;
        var tag=c.tagName, keep=ALLOW[tag];
        if(tag==='SCRIPT'||tag==='STYLE'||tag==='IFRAME'||tag==='OBJECT'||tag==='EMBED') continue;
        if(keep==='br'){ into.appendChild(document.createElement('br')); continue }
        if(keep){
          var el=document.createElement(keep);
          if(keep==='a'){
            var href=c.getAttribute('href')||'';
            if(!/^https?:\/\//i.test(href)){ walk(c, into, inPre); continue }   // a link that is not a web link is just its text
            el.href=href; el.target='_blank'; el.rel='noopener';
          }
          walk(c, el, inPre||keep==='pre'); into.appendChild(el); continue;
        }
        // block-ish tags keep their shape as line breaks; list items get a bullet
        var block=/^(P|DIV|LI|UL|OL|H[1-6]|TR|BLOCKQUOTE|SECTION|ARTICLE)$/.test(tag);
        if(tag==='LI') into.appendChild(document.createTextNode('• '));
        walk(c, into, inPre);
        if(block) into.appendChild(document.createTextNode('\n'));
      }
    }
    walk(doc.body.firstChild, frag, false);
    return frag;
  }
  function when(t){ try{ return new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) }catch(e){ return '' } }
  function node(m){
    var art=document.createElement('article'); art.className='m '+m.r;
    var body=document.createElement('div'); body.className='body';
    if(m.r==='esq') body.appendChild(sanitize(m.m)); else body.textContent=m.m;
    art.appendChild(body);
    if(m.r!=='note'){ var tm=document.createElement('time'); tm.className='when'; tm.dateTime=m.t||''; tm.textContent=when(m.t); art.appendChild(tm) }
    if(m.g){ var tag=document.createElement('span'); tag.className='tag'; tag.textContent='The fabrication guard replaced this reply'; art.appendChild(tag) }
    return art;
  }
  function render(){
    var col=$('col'); var empty=$('empty');
    Array.prototype.slice.call(col.querySelectorAll('.m')).forEach(function(n){ n.remove() });
    empty.hidden=log.length>0;
    log.forEach(function(m){ col.appendChild(node(m)) });
    toBottom();
  }
  function add(m){ log.push(m); saveLog(); $('empty').hidden=true; $('col').appendChild(node(m)); toBottom(); }
  function toBottom(){ var l=$('log'); l.scrollTop=l.scrollHeight }

  /* ---------- status ---------- */
  function setStatus(t, cls){ var s=$('status'); s.textContent=t; s.className='status'+(cls?' '+cls:'') }
  function fmt(s){ var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r }
  function setBusy(on){
    busy=on; $('send').disabled=on; $('sweep').hidden=!on;
    clearInterval(tick); tick=null;
    if(on){ t0=Date.now(); setStatus('Thinking 0:00','busy');
      tick=setInterval(function(){ setStatus('Thinking '+fmt(Math.floor((Date.now()-t0)/1000)),'busy') },1000); }
    else setStatus('Ready');
  }

  /* ---------- sending ---------- */
  function send(e){
    if(e) e.preventDefault();
    var box=$('box'), text=box.value.trim();
    if(!text || busy) return;
    if(!pw){ lockOut('Enter the passphrase again.'); return }
    box.value=''; box.style.height='auto';
    add({r:'me', m:text, t:new Date().toISOString()});
    setBusy(true);
    aborter = (typeof AbortController!=='undefined') ? new AbortController() : null;
    var timer=setTimeout(function(){ if(aborter) aborter.abort() }, WAIT_MS);
    post({action:'chat', password:pw, message:text, source:'web'}, aborter&&aborter.signal)
      .then(function(r){
        if(r.status===401){ lockOut('Session expired. Enter the passphrase again.'); return }
        if(!r.ok) throw new Error('http '+r.status);
        return r.json().then(function(d){
          var reply=(d && typeof d.response==='string') ? d.response.trim() : '';
          if(!reply) throw new Error('empty');
          add({r:'esq', m:reply, t:new Date().toISOString(), g:d.blocked===true});
        });
      })
      .catch(function(err){
        if(!pw) return;   // already locked out
        var why = (err && err.name==='AbortError')
          ? 'No reply in two minutes. Esquiffis may still finish it on his side; ask again in a moment.'
          : 'Something failed on the way back. Try again.';
        add({r:'note', m:why, t:new Date().toISOString()});
      })
      .finally(function(){ clearTimeout(timer); aborter=null; if(pw) setBusy(false); });
  }

  /* ---------- wiring ---------- */
  $('face').src=FACE;
  $('lock-form').addEventListener('submit', unlock);
  $('pw').addEventListener('input', function(){ lockMsg('') });
  $('composer').addEventListener('submit', send);
  var box=$('box');
  box.addEventListener('input', function(){ box.style.height='auto'; box.style.height=Math.min(box.scrollHeight,160)+'px' });
  box.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send() }
  });
  $('clear').addEventListener('click', function(){
    log=[]; saveLog(); render();   // the screen only: Esquiffis's memory is his, on the server
  });
  /* iOS Safari shrinks the VISUAL viewport for the keyboard and leaves the layout
     viewport alone, so a 100dvh column would sit under the keys. Size the app to
     what is actually visible and pin it to the top of it. Nothing is fixed. */
  if(window.visualViewport){
    var vv=window.visualViewport, app=$('app');
    function fit(){
      var h=Math.round(vv.height);
      if(h>0 && Math.abs(window.innerHeight-h)>40){ app.style.height=h+'px'; app.style.transform='translateY('+Math.round(vv.offsetTop)+'px)'; }
      else { app.style.height=''; app.style.transform=''; }
      toBottom();
    }
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
  }
  /* the wordmark must fit its form whatever face rendered it: measure, then step down */
  function fitMark(){
    var mk=$('mark'); if(!mk) return;
    mk.style.fontSize='';
    var size=parseFloat(getComputedStyle(mk).fontSize), guard=0;
    while(mk.scrollWidth>mk.clientWidth && size>40 && guard++<40){ size-=4; mk.style.fontSize=size+'px' }
  }
  fitMark();
  window.addEventListener('resize', fitMark);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitMark);

  pw=loadPw();
  if(pw) enter(); else if(window.matchMedia && matchMedia('(pointer:fine)').matches) $('pw').focus();

  // for the test harness only: read state without touching the DOM contract
  window.__esq={ get log(){return log}, get busy(){return busy}, base:BASE };
})();
</script>
